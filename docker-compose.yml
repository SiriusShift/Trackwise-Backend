services:
  app:
    build: .
    ports:
      - "5001:5000"
    env_file:
      # - .env.render
      - .env
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    ports:
      - "5433:5432" # optional: lets you connect from your host with psql or Prisma Studio
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  studio:
    image: node:20-alpine
    working_dir: /app
    profiles: ["tools"] # only starts with: docker compose --profile tools up studio
    volumes:
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/app
    command: npx -y prisma@6 studio --port 5555 --hostname 0.0.0.0 --browser none
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
